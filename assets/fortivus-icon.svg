<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
	<linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
	  <stop offset="0%" stop-color="#a855f7"/>
	  <stop offset="100%" stop-color="#06b6d4"/>
	</linearGradient>
	<filter id="f" x="-50%" y="-50%" width="200%" height="200%">
	  <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12" flood-color="#a855f7"/>
	</filter>
  </defs>

  <!-- Rounded gradient background -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#g)" filter="url(#f)"/>

  <!-- Layered motif -->
  <g transform="translate(16,18) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
	<rect x="0" y="0" width="32" height="6" rx="2" fill="#ffffff" opacity="0.95" />
	<rect x="4" y="8" width="28" height="6" rx="2" fill="#ffffff" opacity="0.88" />
	<rect x="8" y="16" width="24" height="6" rx="2" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Small accent dot to match site brand -->
  <circle cx="50" cy="14" r="3.5" fill="#a855f7" fill-opacity="0.95" />
</svg>
